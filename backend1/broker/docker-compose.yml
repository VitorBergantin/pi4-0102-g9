services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: meu_broker_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
      - "8883:8883"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    restart: unless-stopped